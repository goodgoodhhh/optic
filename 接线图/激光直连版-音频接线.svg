<text x="70" y="76" font-size="48" fill="#142838" font-weight="700">激光模块直连版｜音频电路与接口详图</text>
<text x="72" y="124" font-size="26" fill="#526575" font-weight="400">1µF 改用 4.7µF 电解 · 缺少的小电容支路可暂留空联调 · 电解极性须先确认直流电位</text>
<rect x="70" y="165" width="2260" height="550" rx="18" fill="#fff" stroke="#d7e3e6" stroke-width="2"/>
<text x="100" y="218" font-size="36" fill="#142838" font-weight="700">① 发送侧：LM386 喇叭输出 → 调理电路 → PA1</text>
<text x="100" y="257" font-size="25" fill="#526575" font-weight="400">GND_A 均为发送侧地；先确认 LM386 喇叭负端与电源负端导通，才按图共地。</text>
