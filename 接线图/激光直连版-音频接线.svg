<text x="2015" y="970" font-size="29" fill="#142838" font-weight="700">接收端功放</text>
<text x="2015" y="1010" font-size="25" fill="#142838" font-weight="400">3.5mm 音频输入</text>
<text x="2015" y="1055" font-size="25" fill="#526575" font-weight="400">音量从最小调起</text>
<text x="2070" y="870" font-size="28" fill="#c94a42" font-weight="700">5V_B</text>
<path d="M 2140 882 L 2140 925" fill="none" stroke="#c94a42" stroke-width="5" stroke-linecap="round"/>
