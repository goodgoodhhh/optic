<path d="M 2133 1224 L 2147 1224" fill="none" stroke="#167b73" stroke-width="5" stroke-linecap="round"/>
<text x="2092" y="1262" font-size="23" fill="#526575" font-weight="400">GND_B</text>
<text x="1220" y="1290" font-size="24" fill="#c94a42" font-weight="700">*输出极性前提：功放输入端直流≈0V，此时＋朝PA4。</text>
<text x="1220" y="1320" font-size="24" fill="#526575" font-weight="400">47nF 缺件可留空；不要用导线或 4.7µF 代替这条支路。</text>
<rect x="70" y="1380" width="2260" height="350" rx="18" fill="#fff" stroke="#d7e3e6" stroke-width="2"/>
<text x="100" y="1433" font-size="36" fill="#142838" font-weight="700">④ 两块板分别连接自己的 OLED 与外接按键</text>
<text x="100" y="1472" font-size="25" fill="#526575" font-weight="400">按实际丝印找引脚：A1=PA1，A2=PA2，A3=PA3，A4=PA4，C0=PC0。</text>
<text x="120" y="1534" font-size="32" fill="#142838" font-weight="700">OLED</text>
<text x="120" y="1580" font-size="29" fill="#142838" font-weight="400">PB8 → SCL    PB9 → SDA</text>
<text x="120" y="1624" font-size="29" fill="#142838" font-weight="400">3V3 → VCC    GND → GND</text>
<text x="120" y="1671" font-size="25" fill="#526575" font-weight="400">屏幕需支持 3.3V</text>
<text x="790" y="1534" font-size="29" fill="#142838" font-weight="700">外接按键：另一端都接本机 GND</text>
<text x="790" y="1580" font-size="27" fill="#142838" font-weight="400">PB1 → K1（文字 / 语音）</text>
<text x="790" y="1624" font-size="27" fill="#142838" font-weight="400">PB0 → K2（发送 / 接收）</text>
<text x="790" y="1668" font-size="27" fill="#142838" font-weight="400">PA5 → K3（发送 / 开始停止）</text>
<text x="1640" y="1534" font-size="31" fill="#c94a42" font-weight="700">K4 已改到 PC0</text>
<text x="1640" y="1580" font-size="29" fill="#142838" font-weight="400">PC0 → K4 → GND</text>
<text x="1640" y="1624" font-size="25" fill="#142838" font-weight="400">停止语音、返回文字并清屏</text>
<text x="1640" y="1668" font-size="25" fill="#526575" font-weight="400">RST、BOOT0 不作为功能按键</text>
<text x="76" y="1798" font-size="29" fill="#142838" font-weight="700">发送侧共 GND_A，接收侧共 GND_B；两板之间靠光通信，无需连接串口线或地线。</text>
<text x="76" y="1844" font-size="25" fill="#526575" font-weight="400">小电容留空仅供初调，音频滤波会减弱；正式语音需补合适低通。输入电压和电解极性需测量。</text>
<text x="605" y="438" font-size="32" fill="#c94a42" font-weight="700">−</text><text x="681" y="438" font-size="32" fill="#c94a42" font-weight="700">+</text><text x="1763" y="987" font-size="32" fill="#c94a42" font-weight="700">+</text><text x="1848" y="987" font-size="32" fill="#c94a42" font-weight="700">−</text><text x="115" y="707" font-size="24" fill="#526575" font-weight="400">滑动端先调到GND端；22nF缺件时该支路留空，不短接、不改成4.7µF。</text><text x="1690" y="1160" font-size="22" fill="#c94a42" font-weight="700">缺件时该支路断开，勿短接</text></svg>