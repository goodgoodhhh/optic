<text x="115" y="1138" font-size="26" fill="#142838" font-weight="400">A板、LM386、音频调理、激光模块的地 → GND_A</text>
<text x="115" y="1181" font-size="27" fill="#142838" font-weight="400">发射模块：＋→3V3；－→GND_A；S→PA2 / A2</text>
<text x="115" y="1224" font-size="25" fill="#c94a42" font-weight="700">按本次厂家资料：S直接接PA2，不接外部三极管。</text>
<text x="115" y="1267" font-size="25" fill="#c94a42" font-weight="700">移除旧S8050及其支路；按模块丝印认引脚。</text>
