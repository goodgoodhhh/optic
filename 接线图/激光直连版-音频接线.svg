</g><rect x="1900" y="395" width="350" height="110" rx="18" fill="#e5f5ef" stroke="#85b9ad" stroke-width="2"/>
<text x="1930" y="439" font-size="33" fill="#142838" font-weight="700">A板 PA1（A1）</text>
<text x="1930" y="480" font-size="25" fill="#526575" font-weight="400">ADC 音频输入</text>
<rect x="1780" y="545" width="465" height="115" rx="18" fill="#fff4dd" stroke="#efce88" stroke-width="2"/>
<text x="1800" y="584" font-size="25" fill="#142838" font-weight="400">静音约 1.65V，初调约 1Vpp</text>
<text x="1800" y="625" font-size="23" fill="#c94a42" font-weight="700">测量确认全程 0～3.3V 后接 PA1</text>
<text x="115" y="673" font-size="25" fill="#c94a42" font-weight="700">*输入极性前提：LM386喇叭输出已隔直且直流≈0V，此时＋朝PA1；否则＋接直流电位较高侧。</text>
<rect x="70" y="755" width="1060" height="585" rx="18" fill="#fff" stroke="#d7e3e6" stroke-width="2"/>
<text x="100" y="808" font-size="35" fill="#142838" font-weight="700">② 激光模块接口：按端子丝印接线</text><text x="100" y="847" font-size="25" fill="#526575" font-weight="400">方案二在软件中反相，接收侧不加反相器。</text><text x="120" y="909" font-size="30" fill="#142838" font-weight="700">接收模块（B侧）</text><text x="120" y="953" font-size="27" fill="#142838" font-weight="400">VCC → 接收板 3V3</text><text x="120" y="997" font-size="27" fill="#337cb9" font-weight="700">GND → GND_B；OUT → PA3 / A3</text><text x="120" y="1041" font-size="26" fill="#142838" font-weight="400">有光 OUT 低；PA3 输入须为 0～3.3V。</text><text x="120" y="1100" font-size="30" fill="#142838" font-weight="700">发射模块（A侧）</text><text x="120" y="1144" font-size="27" fill="#142838" font-weight="400">＋ / VCC → 发送板 3V3；－ / GND → GND_A</text><text x="120" y="1188" font-size="25" fill="#c94a42" font-weight="700">S → PA2 / A2，直接连接（厂家方法2）。</text><text x="120" y="1232" font-size="25" fill="#142838" font-weight="400">不接外部S8050、基极1kΩ和旧LED限流支路。</text><text x="120" y="1276" font-size="25" fill="#142838" font-weight="400">要求：PA2 高 → 激光亮，PA2 低 → 激光灭。</text><text x="120" y="1320" font-size="24" fill="#c94a42" font-weight="700">文字和语音共用这条光链路；最高速率尚需实测。</text>
<rect x="1170" y="755" width="1160" height="585" rx="18" fill="#fff" stroke="#d7e3e6" stroke-width="2"/>
<text x="1200" y="808" font-size="36" fill="#142838" font-weight="700">③ 接收侧：PA4 → 滤波/隔直 → 功放输入</text>
<text x="1200" y="847" font-size="25" fill="#526575" font-weight="400">功放喇叭输出接喇叭；GND_B 均为接收侧地。</text>
<rect x="1210" y="953" width="195" height="95" rx="18" fill="#e5f5ef" stroke="#85b9ad" stroke-width="2"/>
<text x="1231" y="1009" font-size="30" fill="#142838" font-weight="700">B板 PA4</text>
