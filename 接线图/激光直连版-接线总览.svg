<text x="832" y="785" font-size="22" fill="#142838" font-weight="400">S → PA2（A2）</text>
<text x="832" y="826" font-size="20" fill="#142838" font-weight="700">＋→3V3；－→GND_A</text>
<text x="832" y="867" font-size="22" fill="#c94a42" font-weight="700">PA2高：亮；低：灭</text>
