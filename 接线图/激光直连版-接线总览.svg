<text x="2135" y="1267" font-size="27" fill="#142838" font-weight="400">喇叭</text>
<text x="1270" y="1275" font-size="25" fill="#142838" font-weight="700">接收侧：B板、光电前端、滤波与功放共 GND_B。</text>
<text x="1270" y="1314" font-size="24" fill="#526575" font-weight="400">接收播放另需一块功放；两板之间不连接导线。</text>
<rect x="60" y="1370" width="2280" height="260" rx="18" fill="#fff" stroke="#cbd9dd" stroke-width="2"/>
<text x="90" y="1421" font-size="35" fill="#142838" font-weight="700">两块板分别接自己的 OLED 与外接按键</text>
<text x="90" y="1476" font-size="28" fill="#142838" font-weight="400">OLED：PB8 → SCL；PB9 → SDA</text>
<text x="90" y="1522" font-size="28" fill="#142838" font-weight="400">3V3 → VCC；GND → GND</text>
<text x="90" y="1570" font-size="25" fill="#526575" font-weight="400">A1=PA1，A2=PA2，A3=PA3，A4=PA4</text>
<text x="900" y="1476" font-size="28" fill="#142838" font-weight="400">K1 → PB1　K2 → PB0　K3 → PA5　K4 → PC0</text>
<text x="900" y="1522" font-size="27" fill="#142838" font-weight="400">每个按键的另一端接本机 GND，使用外接按键。</text>
<text x="900" y="1570" font-size="25" fill="#142838" font-weight="400">发送端：K1到VOICE，K2到SEND，K3开始；接收自动播放。</text>
<text x="65" y="1674" font-size="29" fill="#142838" font-weight="700">若只有一块 LM386：可放接收侧；手机直接经过音频调理电路后送 PA1。</text>
<text x="65" y="1720" font-size="26" fill="#526575" font-weight="400">先用TEXT发HELLO，再接音频切VOICE；模块最高速率未标明，语音能否稳定传输需实测。</text>
<rect x="1270" y="250" width="1000" height="270" rx="18" fill="#fff" stroke="#afc8dc" stroke-width="2"/>
<text x="1300" y="298" font-size="31" fill="#142838" font-weight="700">接收模块三根线（按丝印，不按孔位）</text><text x="1300" y="349" font-size="27" fill="#142838" font-weight="400">VCC → 接收板 3V3</text><text x="1300" y="396" font-size="27" fill="#142838" font-weight="400">GND → 接收板 GND</text><text x="1300" y="443" font-size="28" fill="#337cb9" font-weight="700">OUT → 接收板 PA3 / A3（直接连接）</text><text x="1300" y="489" font-size="25" fill="#c94a42" font-weight="700">进入 PA3 的电平须在 0～3.3V；本版不加硬件反相器。</text>
</svg>